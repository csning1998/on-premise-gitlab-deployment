---
- name: "Play: Provision Common Operation on Base Image"
  hosts: "all"
  become: true
  roles:
    - foundation_common

- name: "Play: Provision Docker Base Image for Bootstrapper Harbor"
  hosts: "base-docker-harbor"
  become: true
  roles:
    - base_docker
    - base_baremetal_vault
    - base_docker_harbor

- name: "Play: Provision Docker Base Image for Keycloak for OIDC"
  hosts: "base-docker-keycloak"
  become: true
  roles:
    - base_docker
    - base_baremetal_vault
    - base_docker_keycloak

- name: "Play: Provision Kubernetes (Kubeadm) Base Image"
  hosts: "base-kubernetes-kubeadm"
  become: true
  roles:
    - base_kubernetes_kubeadm
    - base_baremetal_vault

- name: "Play: Provision MicroK8s Base Image"
  hosts: "base-kubernetes-microk8s"
  become: true
  roles:
    - base_kubernetes_microk8s
    - base_baremetal_vault

- name: "Play: Provision Postgres (Singular) Base Image"
  hosts: "base-baremetal-postgres"
  become: true
  roles:
    - base_baremetal_postgres
    - base_baremetal_vault

- name: "Play: Provision Redis (Singular) Base Image"
  hosts: "base-baremetal-redis"
  become: true
  roles:
    - base_baremetal_redis
    - base_baremetal_vault

- name: "Play: Provision MinIO (Singular) Base Image"
  hosts: "base-baremetal-minio"
  become: true
  roles:
    - base_baremetal_minio
    - base_baremetal_vault

- name: "Play: Provision Vault (Singular) Base Image"
  hosts: "base-baremetal-vault"
  become: true
  roles:
    - base_baremetal_vault

- name: "Play: Provision HAProxy (Base) Image"
  hosts: "base-baremetal-haproxy"
  become: true
  roles:
    - base_baremetal_haproxy

- name: "Play: Provision Etcd (Base) Image"
  hosts: "base-baremetal-etcd"
  become: true
  roles:
    - base_baremetal_etcd

- name: "Play: Provision Gitaly & Praefect (Base) Image"
  hosts: "base-baremetal-gitaly-praefect"
  become: true
  roles:
    - base_baremetal_gitaly_praefect
    - base_baremetal_vault

- name: "Play: Final Permission Check and Clean up"
  hosts: "all"
  become: true
  roles:
    - foundation_image_finalization
