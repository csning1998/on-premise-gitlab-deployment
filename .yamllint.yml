---
extends: default

# Excludes generated inventory files. Terraform yamlencode() indentation formatting is non-configurable by linter rules.
ignore: |
  ansible/inventory-*.yaml
  .terraform/
  **/.terraform/

rules:
  comments:
    min-spaces-from-content: 1
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  line-length:
    max: 125
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
