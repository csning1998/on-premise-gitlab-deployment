[defaults]
roles_path = ansible/roles
collections_path = ansible/collections
inventory = ansible/inventory.yaml

[ansible-lint]
skip_list:
  - var-naming

[ssh_connection]
# Use Pipelining to prevent from Ansible using scp/sftp
pipelining = True
# Force the native openssh client instead of the Python implementation of Ansible (paramiko).
transport = ssh
